projects:
  - id: "01"
    title: AI 任务助手
    subtitle: 重新设计复杂 AI 任务的创建、执行与反馈体验
    year: "2026"
    role: UX 策略、交互设计、前端原型
    tags:
      - AI UX
      - Prototype
      - Front-end
    problem: 复杂任务通常需要较长处理时间，但用户看不到 AI 正在做什么，也不知道何时应该介入，容易误以为系统已经卡住。
    decision: 将不可见的处理过程拆成目标理解、计划生成、执行和结果验证四个阶段，并为每个阶段提供明确的状态、证据和人工控制点。
    deliverables:
      - 用户流程与异常状态
      - 高保真交互原型
      - React 可运行验证版本
      - 5 人可用性测试
    result: 演示测试中，任务中断率下降 23%，用户对当前进度的理解度明显提升。
    link: https://example.com/ai-task-assistant
  - id: "02"
    title: 城市跑腿服务重设计
    subtitle: 降低多步骤下单流程中的理解和填写成本
    year: "2025"
    role: 用户研究、服务设计、交互设计
    tags:
      - UX Strategy
      - Research
      - Interaction
    problem: 用户需要把一句简单的现实需求翻译成长表单，平台的运营复杂度被直接暴露给了用户。
    decision: 围绕用户意图重新组织流程，先确认任务与地址，再按需要逐步补充物品和配送约束。
    deliverables:
      - 访谈与问题归因
      - 端到端用户旅程
      - 下单与物流跟踪原型
      - 内容与状态规范
    result: 核心路径由 14 个决策点减少到 8 个，概念测试中的任务完成时间缩短 31%。
    link: https://example.com/errand-redesign
  - id: "03"
    title: 设计系统自动化工具
    subtitle: 连接设计变量、组件文档与前端代码
    year: "2026"
    role: 产品设计、系统设计、工程实现
    tags:
      - Design System
      - TypeScript
      - AI Workflow
    problem: 设计变量、组件规范和前端 Token 分散在不同工具中，更新依赖人工同步，错误很难及时发现。
    decision: 建立单一数据源，并让设计与代码的差异检查成为持续工作流的一部分，而不是发布前的人工清单。
    deliverables:
      - Token 数据模型
      - 命令行同步工具
      - 差异报告界面
      - 团队使用文档
    result: 演示流程将一次完整同步从约 40 分钟缩短到 4 分钟，并保留可追溯的变更记录。
    link: https://example.com/design-system-cli
