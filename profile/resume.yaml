about:
  summary: 我喜欢把模糊的问题变成清晰的体验，也喜欢亲手把体验做成可以运行、可以验证的产品。我的工作横跨用户研究、信息架构、交互设计、原型和前端实现。
  principles:
    - 先理解用户为什么卡住，再决定界面应该长什么样。
    - 用可运行原型缩短设计、产品与工程之间的讨论距离。
    - 让 AI 的能力可见、可控、可理解，而不是只增加一个输入框。

